services:
  - type: web
    name: jarvis-demo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8756"
      - key: JARVIS_HOST
        value: "0.0.0.0"
      - key: JARVIS_PORT
        value: "8756"
      - key: JARVIS_DEMO_MODE
        value: "true"
      - key: JARVIS_APP_ENV
        value: "production"
      - key: JARVIS_ALLOW_NON_LOOPBACK
        value: "true"
      - key: JARVIS_ALLOW_UNAUTHENTICATED_API
        value: "false"
      - key: JARVIS_DATABASE_REQUIRED
        value: "true"
      - key: JARVIS_TTS_ENABLED
        value: "false"
      - key: JARVIS_TTS_AUTOSTART
        value: "false"
      - key: JARVIS_RATE_LIMIT
        value: "30/minute"
      - key: JARVIS_RATE_LIMIT_PER_USER
        value: "45/minute"
      - key: JARVIS_RATE_LIMIT_GLOBAL
        value: "300/minute"
      - key: JARVIS_OPENAI_API_KEY
        sync: false
      - key: JARVIS_DATABASE_URL
        sync: false
      - key: JARVIS_SUPABASE_URL
        sync: false
      - key: JARVIS_SUPABASE_ANON_KEY
        sync: false
      - key: JARVIS_CORS_ORIGINS
        sync: false
