[project]
name = "jarvis"
version = "0.1.0"
description = "Personal Obsidian-backed assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chonkie>=1.7.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langsmith>=0.10.16",
    "pydantic-settings>=2.14.2",
    "pypdf>=5.0,<7",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
jarvis = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: long-running smoke checks (e.g. frontend build)",
]
